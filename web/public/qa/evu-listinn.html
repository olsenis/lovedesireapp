<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Evu-listinn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Lato:wght@400;700&display=swap">
<style>
  /* Tokens follow the Love Desire app's own palette (constants/colors.ts)
     so the page reads as a sheet from the app Eva is testing. */
  :root {
    color-scheme: light;
    --bg: #FFF8F0;
    --surface: #FFFFFF;
    --ink: #3D1A24;
    --ink-2: #6B4652;
    --muted: #9E7B84;
    --accent: #880E4F;
    --accent-ink: #FFF8F0;
    --rose: #F4A7B9;
    --line: #F0D5DC;
    --good: #2E7D32;
    --warn: #7A5200;
    --warn-bg: #FFF4CC;
    --focus: #880E4F;
    --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --sans: "Lato", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1F1016;
      --surface: #2A171E;
      --ink: #FFF1E8;
      --ink-2: #E5C9D1;
      --muted: #B98F9A;
      --accent: #F4A7B9;
      --accent-ink: #2A171E;
      --rose: #B0566F;
      --line: #4A2A35;
      --good: #9CCC65;
      --warn: #F1D27A;
      --warn-bg: #3A2E10;
      --focus: #F4A7B9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1F1016;
    --surface: #2A171E;
    --ink: #FFF1E8;
    --ink-2: #E5C9D1;
    --muted: #B98F9A;
    --accent: #F4A7B9;
    --accent-ink: #2A171E;
    --rose: #B0566F;
    --line: #4A2A35;
    --good: #9CCC65;
    --warn: #F1D27A;
    --warn-bg: #3A2E10;
    --focus: #F4A7B9;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  main { max-width: 34rem; margin: 0 auto; padding: 1.75rem 1.25rem 4rem; }

  .eyebrow {
    margin: 0 0 .5rem;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 2.6rem;
    line-height: 1.05;
    letter-spacing: -.01em;
    color: var(--accent);
    text-wrap: balance;
  }
  .lede { margin: .6rem 0 0; color: var(--ink-2); max-width: 60ch; }

  .progress { display: flex; align-items: center; gap: .75rem; margin-top: 1.25rem; }
  .bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .fill { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
  .count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .day { margin-top: 2.25rem; }
  .day h2 { display: flex; align-items: baseline; gap: .75rem; margin: 0; padding-bottom: .35rem; border-bottom: 1px solid var(--line); }
  .dayname { font-family: var(--serif); font-weight: 600; font-size: 1.65rem; line-height: 1.1; color: var(--accent); }
  .daydate { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  .item { padding: 1rem 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .row {
    display: flex; align-items: center; gap: .75rem;
    min-height: 44px; cursor: pointer; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .row input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .box {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--rose); background: var(--surface);
    display: grid; place-items: center;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .box::after {
    content: ""; width: 11px; height: 6px;
    border-left: 2.5px solid var(--accent-ink); border-bottom: 2.5px solid var(--accent-ink);
    transform: rotate(-45deg) translate(1px, -1px); opacity: 0;
  }
  .row input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .row input:checked + .box::after { opacity: 1; }
  .row input:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 3px; }
  .num { width: 1.3em; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .title { font-weight: 700; font-size: 1.05rem; line-height: 1.3; }
  .item.done .title { color: var(--muted); }
  .item.done .body { opacity: .55; }

  .body { display: grid; gap: .55rem; margin-top: .45rem; padding-left: calc(28px + .75rem); }
  .where { margin: 0; font-size: .85rem; color: var(--muted); }
  .warn {
    margin: 0; padding: .6rem .8rem; border-radius: 8px;
    background: var(--warn-bg); color: var(--warn); font-size: .9rem; line-height: 1.45;
  }
  .steps { margin: 0; padding-left: 1.3em; color: var(--ink-2); font-size: .95rem; display: grid; gap: .25rem; }
  .steps li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
  .expect { margin: 0; display: flex; gap: .5rem; align-items: baseline; font-size: .9rem; color: var(--ink-2); }
  .tick { color: var(--good); font-weight: 700; flex: none; }

  .foot { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .foot p { margin: 0; font-size: .8rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>

<script>
(function () {
  // Content. Icelandic prose for Eva; app labels quoted exactly as the
  // English UI renders them (the partner's profile name is "Oli").
  var DAYS = [
    { id: 'l1', label: 'Lota 1', date: 'Strax, ekkert sérstakt þarf', items: [
      { id: 'moods5', num: 1, title: 'Fimm ný mood', where: 'Home, mood-röðin',
        steps: ['Skrunaðu mood-röðina til enda', 'Veldu „Off" 🫥 eða „Check in with me" 🙋'],
        expect: 'Nýju fimm eru þar: Off, In my head, Overthinking, Tender, Check in with me. Óli sér valið þitt í parakortinu.' },
      { id: 'ownwords', num: 2, title: 'Mood í eigin orðum', where: 'Home → síðasti flipinn „💬 Own words"',
        steps: ['Skrifaðu eitt eða tvö orð (t.d. „Bone tired") → „Set mood"', 'Ýttu svo á mood-pilluna þína í parakortinu (opnar Mood History)'],
        expect: 'Pillan þín sýnir 💬. Í Mood History stendur orðið þitt á 💬-flipanum. Hámark 24 stafir.' },
      { id: 'ask', num: 3, title: 'Daily: spyrðu Óla að einhverju', where: 'Home → Daily → hlekkur undir flokkunum „Write your own question ›"',
        steps: ['Skrifaðu spurningu → „Send"', 'Svaraðu henni sjálf', 'Óli svarar á sínum síma'],
        expect: 'Kort merkt „FROM EVA" birtist í öllum flokkum á báðum símum. Hlekkurinn hverfur hjá þér í dag, Óli hefur enn sinn. Svörin birtast hlið við hlið þegar bæði eru komin.' },
      { id: 'askback', num: 4, title: 'Daily: spurning frá Óla', where: 'Home → Daily',
        warn: 'Óli sendir sína spurningu fyrst.',
        steps: ['Finndu kortið „FROM OLI" og svaraðu'],
        expect: 'Bæði kortin (þitt og Óla) eru í Daily á sama tíma, og bæði teljast í „Reveals ›".' },
      { id: 'heartdaily', num: 5, title: 'Hjarta og ein lína á svar', where: 'Daily, á spurningu sem þið bæði hafið svarað',
        steps: ['Ýttu á ❤️ undir svörunum', '„Reply" → ein lína → senda', 'Ýttu aftur á línuna þína og breyttu henni'],
        expect: 'Óli sér hjartað þitt og „Eva: …". Engin hjörtu eða svör sjást á spurningum sem annað ykkar á eftir að svara.' },
      { id: 'heartsunday', num: 6, title: 'Hjarta á Sunday-svar', where: 'Us → Sunday Check-in (vika þar sem bæði kláruðu)',
        steps: ['❤️ og ein lína á eitt svar Óla', 'Opnaðu eldri viku í History'],
        expect: 'Hjartað og línan sjást hjá Óla. Í History sjást þau en er ekki hægt að breyta.' },
      { id: 'discreet', num: 7, title: 'Discreet-rofinn', where: 'Profile → „Discreet on the lock screen" (hjá notification-rofanum)',
        steps: ['Rofinn á að vera Á sjálfgefið', 'Slökktu, lokaðu appinu, opnaðu aftur'],
        expect: 'Stillingin helst. Kveiktu aftur á eftir. (Push-textinn sjálfur prófast fyrst í alvöru buildi.)' },
      { id: 'applock', num: 8, title: 'Læsa appinu', where: 'Profile → Privacy → „Lock the app"',
        steps: ['Kveiktu (síminn biður um auðkenningu)', 'Farðu í app switcher og skoðaðu smámyndina', 'Bíddu rúma mínútu utan appsins, opnaðu aftur', 'Slökktu aftur á eftir'],
        expect: 'Smámyndin sýnir bara kremaðan skjá með nafninu, ekkert efni. Eftir mínútu biður appið um auðkenningu. Í Expo Go á iPhone kemur passcode í stað Face ID, það er eðlilegt.' },
      { id: 'paywall', num: 9, title: 'Paywall segir satt', where: 'Profile → Upgrade (eða læst kort í Discover)',
        warn: 'Bara ef parið er EKKI með Premium núna.',
        steps: ['Skoðaðu verðraðirnar og línuna undir takkanum'],
        expect: '„Free until {dagsetning eftir 7 daga}, then $39.99 a year…" og „Cancel before then and you pay nothing." Engin AI-umfjöllun neins staðar.' }
,
      { id: 'answers', num: 28, title: 'Eldri svör í Our Story', where: 'Us → Our Story → „Daily answers" (eða Daily → „Your past answers, in Our Story ›" þegar dagurinn er búinn)',
        steps: ['Opnaðu nýjasta mánuðinn', 'Finndu dag þar sem þið Óli svöruðuð bæði'],
        expect: 'Spurningin með „You" og „Oli" hlið við hlið, hjörtu og línur sjást en er ekki hægt að breyta. Spurning sem bara annað ykkar svaraði sést EKKI. Dagurinn í dag er ekki þar.' }
    ]},
    { id: 'l2', label: 'Lota 2', date: 'Premium Á (Óli kveikir í Firebase)', items: [
      { id: 'fwcats', num: 10, title: 'Fantasy Wishes: flokkar', where: 'Discover → Fantasy Wishes → ☰ efst',
        warn: 'Óli setur isPremium = true á parið áður en þessi lota byrjar.',
        steps: ['Opnaðu „Categories"', 'Slökktu á BDSM', 'Kjóstu nokkur spil'],
        expect: 'Fyrstu spilin eru Sensual. Engin BDSM-spil koma. Hjá Óla er BDSM líka slökkt (stillingin er sameiginleg). Matches breytast ekki.' },
      { id: 'fwalloff', num: 11, title: 'Fantasy Wishes: allt slökkt', where: 'Sama ☰ blað',
        steps: ['Slökktu á öllum fjórum', 'Kveiktu svo aftur á öllum'],
        expect: 'Kort „Every category is off" með „Turn one back on…". Stokkurinn kemur aftur þegar kveikt er.' },
      { id: 'fwdraw', num: 12, title: 'Draw one for tonight', where: 'Fantasy Wishes → Matches',
        warn: 'Þarf minnst tvö match. Ýtið bæði jafn oft á takkann.',
        steps: ['Þið Óli ýtið bæði á „🎲 Draw one for tonight"', 'Berið saman símana', 'Bæði ýta á „🎲 Draw again"'],
        expect: 'Sama match efst á báðum símum, merkt „🎲 Tonight\'s draw". „+ Add to Together List" virkar á því. Draw again gefur nýtt, aftur það sama hjá báðum.' },
      { id: 'fwheart', num: 13, title: 'Hjarta á match', where: 'Fantasy Wishes → Matches',
        steps: ['❤️ og ein lína á eitt match'],
        expect: 'Óli sér hvort tveggja á sínu match-korti.' }
    ]},
    { id: 'l3', label: 'Lota 3', date: 'Premium AF aftur (Óli slekkur)', items: [
      { id: 'readfw', num: 14, title: 'Lesaðgangur: Fantasy Wishes', where: 'Discover → Fantasy Wishes (kortið sýnir 🔒)',
        warn: 'Óli setur isPremium = false. Appið á EKKI að henda þér beint á Upgrade.',
        steps: ['Ýttu á kortið'],
        expect: 'Skjárinn opnast með borða „Premium has ended. Everything you saved is still yours…". Matches sjást, enginn stokkur til að kjósa í, „+ Add to Together List" virkar enn. Borðinn opnar Upgrade.' },
      { id: 'readlog', num: 15, title: 'Lesaðgangur: Intimacy Log', where: 'Us → Intimacy Log',
        steps: ['Opnaðu Log og Stats'],
        expect: 'Færslurnar og Stats sjást. Enginn „We were intimate" takki, ekki hægt að eyða.' },
      { id: 'readlovers', num: 16, title: 'Lesaðgangur: The Lovers og Activity Cards', where: 'Us → The Lovers · Discover → Activity Cards',
        steps: ['Opnaðu bæði'],
        expect: 'The Lovers sýnir niðurstöðuna þína og samanburðinn, enginn Retake. Activity Cards sýnir borðið með kláruðum spilum, ekkert hægt að snúa. Presence og Tease fara beint á Upgrade (viljandi).' }
    ]},
    { id: 'fri18', label: 'Föstudagur', date: '18. september (frá umferð 2)', items: [
      { id: 'lovers-tip', num: 17, title: 'Lovers-ráð á Home', where: 'Home, efst í „Waiting for you"',
        warn: 'Þarf Premium Á.',
        steps: ['Er þar kort 🧬 „A Lovers tip for the weekend" eða „What lights Oli up"?'],
        expect: 'Textinn nefnir Óla, ekki þig. Tap opnar The Lovers, kortið hverfur út vikuna.' }
    ]},
    { id: 'sun20', label: 'Sunnudagur', date: '20. september (frá umferð 2)', items: [
      { id: 'sunday39', num: 18, title: 'Sunday Check-in, vika 39', where: 'Us → Sunday Check-in',
        steps: ['5 takkaraðir (1 til 5), 5 spurningar', 'Síðasta skrefið „A little something for Oli": skrifaðu eitt lítið sem ÞÚ ætlar að gera fyrir Óla (eða „Skip this part")', '„Save and finish ✓"'],
        expect: 'Svör hlið við hlið þegar Óli er búinn, með ❤️ og Reply undir hverju svari. Óli sér ALDREI það sem þú skrifaðir í síðasta skrefinu. Næsta sunnudag færðu spjaldið „Last time you planned" og hakar við það sem þú gerðir, og bara það birtist Óla sem „🎁 Eva did this for you, on purpose".' }
    ]},
    { id: 'last', label: 'Síðast', date: 'Aftenging, gerið þetta allra síðast', items: [
      { id: 'a1new', num: 19, title: 'Nýr maki fær ekkert gamalt', where: 'Óli stýrir, þú fylgist með',
        warn: 'Þetta aftengir ykkur tímabundið. Óli notar þriðja reikning („Test") sem nýjan maka.',
        steps: [
          'Þú: Profile → „Disconnect couple" → „Disconnect"',
          'Óli: parar sig við Test-reikninginn með kóða og samþykkir',
          'Test-reikningurinn skoðar Intimacy Log, Fantasy Wishes Matches, Sunday History, Notes, Moments'
        ],
        expect: 'Allt er TÓMT hjá Test. Ekkert frá ykkur Óla sést. Óli sér heldur ekki gömlu gögnin í nýja parinu.' },
      { id: 'a1back', num: 20, title: 'Þú kemur aftur og allt er þar', where: 'Pairing-skjárinn, „I have a code"',
        steps: [
          'Óli aftengist Test og býr til nýjan kóða',
          'Þú slærð inn kóðann → Óli samþykkir',
          'Skoðaðu Sunday History, Matches og Moments'
        ],
        expect: 'Þú ferð sjálfkrafa inn á Home þegar Óli samþykkir (enginn Retry-takki). Gamla sagan ykkar er öll komin aftur.' },
      { id: 'c6wait', num: 21, title: 'Home á meðan beðið er', where: 'Home, á meðan þú ert ótengd (milli skrefa í nr. 19 og 20)',
        steps: ['Skoðaðu Home áður en þú slærð inn kóðann hans Óla'],
        expect: 'Undir boðskortinu er „While you wait": Send the invite, Add a Special Day, Take the Love Language quiz, Write a Love Note. Engar Tonight\'s Picks flísar. „Send the invite" opnar deiliblaðið með kóða og hlekk.' }
    ]},
    { id: 'dev', label: 'Dev build', date: 'Þegar fyrsta iPhone buildið er komið', items: [
      { id: 'push-basic', num: 22, title: 'Push berst yfirhöfuð', where: 'Profile → notification-rofinn Á, á báðum símum',
        warn: 'Ekkert í þessari lotu virkar í Expo Go. Bíður eftir alvöru buildi á iPhone.',
        steps: ['Óli skrifar Love Note sem opnast strax', 'Læstu símanum þínum á meðan'],
        expect: 'Tilkynning kemur á læsta skjáinn þinn innan nokkurra sekúndna.' },
      { id: 'push-discreet-on', num: 23, title: 'Push með Discreet Á (sjálfgefið)', where: 'Læsti skjárinn þinn',
        steps: [
          'Þú ýtir á „Tonight? 🔥", svo Óli',
          'Óli velur mood',
          'Þið fáið Fantasy Wishes match',
          'Óli skrifar Reply á svar í Daily'
        ],
        expect: 'Bara hlutlaus texti: „Tonight ✓ / You and Oli are on the same page.", „Oli updated a mood", „Open to read it.". Aldrei mood-heitið, texti spilsins eða línan sjálf.' },
      { id: 'push-discreet-off', num: 24, title: 'Push með Discreet AF', where: 'Profile → „Discreet on the lock screen" → af',
        steps: ['Endurtakið sömu fjögur skref og í nr. 23', 'Kveiktu aftur á Discreet á eftir'],
        expect: 'Nú sést fulli textinn, t.d. „Oli is feeling 💬 Bone tired" og línan úr Reply.' },
      { id: 'push-ask', num: 25, title: 'Push: „Oli asked you something 💬"', where: 'Daily',
        steps: ['Óli sendir spurningu með „Write your own question ›"', 'Ýttu á tilkynninguna'],
        expect: 'Með Discreet Á stendur „Open Daily." undir titlinum, ekki spurningin. Tap opnar appið.' },
      { id: 'faceid', num: 26, title: 'Face ID í stað passcode', where: 'Profile → Privacy → „Lock the app"',
        steps: ['Kveiktu', 'Lokaðu appinu alveg og opnaðu aftur', 'Farðu út í rúma mínútu og komdu aftur'],
        expect: 'Face ID kemur upp (ekki talnakóðinn) í bæði skiptin. Í fyrsta sinn spyr iOS um Face ID leyfi fyrir appið. App switcher sýnir kremaða huluna.' },
      { id: 'rating', num: 27, title: 'Beiðni um stjörnur', where: 'Eftir góða stund: match, Sunday-afhjúpun, Memory Lane búið',
        warn: 'Kemur fyrst eftir 7 daga frá fyrstu opnun á buildinu og þrjár góðar stundir. Í TestFlight birtist blaðið en einkunnin sendist ekki.',
        steps: ['Notaðu appið eðlilega í viku', 'Taktu eftir hvenær stjörnublað Apple birtist'],
        expect: 'Blaðið kemur um tveimur sekúndum eftir góða stund. Aldrei á Home, aldrei við opnun, aldrei eftir paywall. Ekki aftur næstu 90 daga.' }
    ]}
  ];
  var ALL = DAYS.reduce(function (a, d) { return a.concat(d.items); }, []);

  // Ticks live in this phone's browser only.
  var LS = 'evu-listinn-v3';
  var done = {};
  try { done = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) {}

  var app = document.getElementById('app');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render() {
    var total = ALL.length;
    var doneN = ALL.filter(function (i) { return !!done[i.id]; }).length;
    var pct = total ? Math.round(doneN / total * 100) : 0;
    var h = '';
    h += '<header class="top">';
    h += '<p class="eyebrow">Love Desire · prófun á síma B</p>';
    h += '<h1>Evu-listinn</h1>';
    h += '<p class="lede">Umferð 3: allt sem bættist við 14. til 17. september. Þrjár lotur sem má taka í einni setu, tvö atriði sem bíða síns dags, aftengingin síðast, og neðst það sem bíður fyrsta iPhone buildsins. Enskir takkar eru skrifaðir eins og þeir birtast í appinu.</p>';
    h += '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + doneN + '" aria-label="Framvinda">';
    h += '<span class="bar"><span class="fill" style="width:' + pct + '%"></span></span>';
    h += '<span class="count">' + doneN + ' af ' + total + ' búið</span></div>';
    h += '</header>';
    DAYS.forEach(function (d) {
      h += '<section class="day"><h2><span class="dayname">' + esc(d.label) + '</span><span class="daydate">' + esc(d.date) + '</span></h2>';
      d.items.forEach(function (it) {
        var on = !!done[it.id];
        h += '<article class="item' + (on ? ' done' : '') + '">';
        h += '<label class="row"><input type="checkbox" data-id="' + esc(it.id) + '"' + (on ? ' checked' : '') + '>';
        h += '<span class="box" aria-hidden="true"></span>';
        h += '<span class="num">' + it.num + '</span><span class="title">' + esc(it.title) + '</span></label>';
        h += '<div class="body">';
        if (it.where) h += '<p class="where">' + esc(it.where) + '</p>';
        if (it.warn) h += '<p class="warn">' + esc(it.warn) + '</p>';
        if (it.steps && it.steps.length) {
          h += '<ol class="steps">';
          it.steps.forEach(function (s) { h += '<li>' + esc(s) + '</li>'; });
          h += '</ol>';
        }
        if (it.expect) h += '<p class="expect"><span class="tick" aria-hidden="true">✓</span><span>' + esc(it.expect) + '</span></p>';
        h += '</div></article>';
      });
      h += '</section>';
    });
    h += '<footer class="foot"><p>Hökin vistast í þessum síma.</p></footer>';
    app.innerHTML = h;
  }

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (!(t && t.matches && t.matches('input[type="checkbox"][data-id]'))) return;
    var id = t.getAttribute('data-id');
    if (t.checked) done[id] = Date.now(); else delete done[id];
    try { localStorage.setItem(LS, JSON.stringify(done)); } catch (e2) {}
    render();
  });

  render();
})();
</script>
</body>
</html>
